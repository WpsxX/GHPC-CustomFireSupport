# CustomFireSupport - sample config (exactly what the mod writes on first run).
# Copy it into <game>\Bin\UserData\MelonPreferences.cfg, or just edit that file directly.
# Scales: 1.0 = vanilla, 0.5 = half, 0 / -1 = off or instant. Missions -1 = unlimited calls.

[CustomFireSupport]
# CustomFireSupport 配置（本段由 mod 自己解析，不经 MelonLoader 的 entry 层）。
# 改完重开任务生效（槽位只在任务开始时构建）；HideVanillaFireSupport 同样需重开任务。
# 槽位键带 SlotN_ 前缀；6 个槽位默认全部开启，用不到的槽把它的 Enabled 改成 false 即可。
# 默认布局：1 = 常规炮击，2 = 烟幕，3 = 照明弹，4/5/6 = CAS（机炮扫射 / 火箭弹 / 炸弹）。

Enabled = true  # 总开关：false = mod 完全不动作
HideVanillaFireSupport = true  # true = 地图上只显示你的槽位（官方炮组/架次数组不动，脚本火力照常）
IlluminationOnlyAtNight = true  # true = 照明槽位只在夜间出现（默认）；false = 白天也能用
SmokeOnlyDuringDay = true  # true = 烟幕槽位只在白天出现（默认）；夜间烟雾看不见，自动隐藏；false = 全天可用
VerboseLogging = false  # true = 把模板发现/槽位解析细节打印到日志
CasDeployDistanceMeters = 8000.0  # 仅当关卡没有 CasSupportManager 时：自建管理器的飞机起飞点距玩家起始位置多远（米）
CasDeployBearingDegrees = 180.0  # 上述起飞点方位角（度），0 = +Z（北），顺时针
CasPrewarmKeys = "auto"  # 会话启动时额外预加载的 Addressables 键（逗号分隔）；auto = 无（CAS 机型/挂架/弹药都由随 mod 的 cas_assets 包提供，无需额外键）。空 = 关

# ===== 槽位 1 =====
Slot1_Enabled = true  # 槽位开关（默认全开）
Slot1_Type = "Artillery"  # Artillery | ArtillerySmoke | ArtilleryIllumination | CASSupport（固定翼 CAS）；别名 HE/Smoke/Illum/CAS 也认
Slot1_DisplayName = "Custom Artillery"  # 地图按钮上的名字
Slot1_Missions = 3  # 可用呼叫次数（CAS 为架次）：-1 = 无限
Slot1_RoundsPerCall = -1  # 单次弹数：-1 = 用游戏自己炮组的弹数；>0 = 指定
Slot1_Munition = "AntiPersonnel"  # 弹种（仅火炮）：AntiPersonnel | AntiArmor | Smoke | Illumination；留空 = 随槽位类型
Slot1_Weapon = "Any"  # Guns | Mortars | Rockets | Any（仅影响 WeaponType 属性）
Slot1_ImpactDelaySeconds = 1.0  # 首弹延迟倍率：1 = 游戏原值；<1 = 取消首弹延迟（首弹立即到）；0/负数 = 整梭子当帧打完。只影响首弹，不压缩发间隔
Slot1_InterShotDelaySeconds = 1.0  # 发间隔倍率（发间隔只由本键决定）：1 = 原值（通常 0.7 秒），0.5 = 一半，0 = 同一帧打完
Slot1_DispersionMeters = 1.0  # 散布倍率：1 = 原值，0.5 = 一半，0 = 全部同一点（仅火炮）
Slot1_CooldownSeconds = 1.0  # 冷却：火炮 = 倍率（1=原值）；CAS = 直接秒数（已去除游戏原生 120 秒）；-1/0 = 无冷却
Slot1_AmmoName = ""  # 可选：弹药名包含该文本（如 155mm）；留空 = 取该弹种第一个模板
Slot1_CasFlyover = ""  # 飞行方式：留空 = 按机型自动；也可写 SinglePass（单次通过）| Linger（盘旋约 60 秒）
Slot1_CasAccuracy = 1.0  # CAS 落点圆半径 = 值 × 15 米（0–1 之间按百分比；0.5 = 7.5 m，1 = 15 m，>1 更大）：0 = 每一发都飞进目标中心（机炮/火箭弹/炸弹都精确命中）；**对空地导弹无效**——它固定 1 发、永远 100% 命中锁定目标中心；对游戏自带导弹挂载也无效（仍由游戏自己制导）
Slot1_CasAttackTypes = "Any"  # 攻击方式：Any | 逗号列表 Bombs,Rockets,AirToGroundMissile(AGM/ATGM/Missile),GunRun（只保留机型实际挂载的；空地导弹机型固定为 A-10/MiG-23BN）；留空 = 用机型自带挂载。空空导弹与训练弹（AirToAirMissile / Inert）已移除，写了会被忽略并记警告
# 机型 / 弹药 / 生成高度 / 入射角 / 来向 / 再装填全部交给游戏自己处理，不用配

