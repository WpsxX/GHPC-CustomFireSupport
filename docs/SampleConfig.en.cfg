# CustomFireSupport - sample config, English comments (the mod itself writes the Chinese section).
# Copy this section into <game>\Bin\UserData\MelonPreferences.cfg, or just edit that file directly.
# Keys and values are identical to SampleConfig.cfg; only the comments differ.

[CustomFireSupport]
# CustomFireSupport config (parsed by the mod itself, not by MelonLoader's entry layer).
# Changes apply after re-starting the mission (slots are built at mission start); HideVanillaFireSupport too.
# Slot keys carry a SlotN_ prefix; all six slots are on by default - set Enabled = false to drop one.
# Default layout: 1 = artillery, 2 = smoke, 3 = illumination, 4/5/6 = CAS (gun run / rockets / bombs).

Enabled = true  # master switch: false = the mod does nothing at all
HideVanillaFireSupport = true  # true = only your slots show on the map (the vanilla battery / sortie arrays are untouched, scripted fire support still runs)
IlluminationOnlyAtNight = true  # true = illumination slots appear at night only (default); false = usable by day too
SmokeOnlyDuringDay = true  # true = smoke slots appear during the day only (default); smoke is invisible at night, so they auto-hide; false = usable around the clock
VerboseLogging = false  # true = print template discovery / slot parsing details to the log
CasDeployDistanceMeters = 8000.0  # only when the mission has no CasSupportManager: how far the self-built manager's aircraft spawn point sits from the player's start position (metres)
CasDeployBearingDegrees = 180.0  # bearing of that spawn point (degrees), 0 = +Z (north), increasing clockwise
CasPrewarmKeys = "auto"  # extra Addressables keys to preload at session start (comma-separated); auto = none (CAS airframes / hardpoints / ammo all ship in the cas_assets pack, so no extra key is needed); empty = off

# ===== slot 1 =====
Slot1_Enabled = true  # slot switch (all six are on by default)
Slot1_Type = "Artillery"  # Artillery | ArtillerySmoke | ArtilleryIllumination | CASSupport (fixed-wing CAS); the aliases HE/Smoke/Illum/CAS are accepted too
Slot1_DisplayName = "Custom Artillery"  # name shown on the map button
Slot1_Missions = 3  # number of calls (sorties for CAS): -1 = unlimited
Slot1_RoundsPerCall = -1  # rounds per call: -1 = use the game battery's own count; >0 = force it
Slot1_Munition = "AntiPersonnel"  # shell type (artillery only): AntiPersonnel | AntiArmor | Smoke | Illumination; empty = follow the slot type
Slot1_Weapon = "Any"  # Guns | Mortars | Rockets | Any (only affects the WeaponType property)
Slot1_ImpactDelaySeconds = 1.0  # time-to-first-impact scale: 1 = the game's own value; <1 = drop the delay (first round lands instantly); 0/negative = the whole volley in a single frame. Only the first round - the interval is untouched
Slot1_InterShotDelaySeconds = 1.0  # interval-between-rounds scale (this key alone decides the interval): 1 = the game's own value (about 0.7 s), 0.5 = half, 0 = every round in the same frame
Slot1_DispersionMeters = 1.0  # dispersion scale: 1 = the game's own radius, 0.5 = half, 0 = every round on the same spot (artillery only)
Slot1_CooldownSeconds = 1.0  # cooldown: artillery = a scale (1 = the game's own value); CAS = seconds directly (the native 120 s is removed); -1/0 = no cooldown
Slot1_AmmoName = ""  # optional: only rounds whose name contains this text (e.g. 155mm); empty = take the first template of the shell type
Slot1_CasFlyover = ""  # flyover profile: empty = automatic per airframe; or SinglePass (one pass) | Linger (circle for about 60 s)
Slot1_CasAccuracy = 1.0  # CAS impact circle radius = value x 15 m (between 0 and 1 read as a percentage; 0.5 = 7.5 m, 1 = 15 m, >1 larger): 0 = every round flies into the target's centre (guns / rockets / bombs all hit precisely); **does not apply to air-to-ground missiles** - one per sortie, always a 100% hit on the locked target's centre; it does not apply to the game's own missile loadouts either (they stay under the game's guidance)
Slot1_CasAttackTypes = "Any"  # attack types: Any | comma list Bombs,Rockets,AirToGroundMissile(AGM/ATGM/Missile),GunRun (only what the airframe actually carries is kept; the AGM airframes are fixed to A-10 / MiG-23BN); empty = use the airframe's own loadout. Air-to-air missiles and training rounds (AirToAirMissile / Inert) have been removed - writing them is ignored with a warning
# airframe / ammo / spawn altitude / impact angle / approach direction / reload are all left to the game - nothing to configure

